name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Syntax check
        run: for f in bin/*.mjs src/*.mjs ui/app.js; do node --check "$f"; done
      - name: Python syntax check
        run: python3 -m py_compile src/ratchet_pty.py
      - name: Tests
        run: npm test
      - name: Install script smoke test
        run: |
          sh -n install.sh
          node bin/ratchet.mjs --version
