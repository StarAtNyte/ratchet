# The bottom layer of every task's [agent]: which CLI runs a turn, which model it asks for,
# where the tokens go (`provider`: `native`, or a name from backends.toml) and how long one
# turn may run. task.toml writes only the keys it changes; [agent.teacher] / [agent.student]
# override one agent, at either layer. Absent `effort` leaves the choice to the CLI.
[agent]
backend   = "claude"
provider  = "native"
model     = "claude-opus-5-5"
timeout_s = 7200            # one student turn is one iteration

[agent.teacher]
effort    = "high"
timeout_s = 14400           # reconnaissance, distillation and diagnosis run for hours
