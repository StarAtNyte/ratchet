# Where this operator tree's GPU jobs run (non-secret). `forge run` writes this file from
# the machine's local.env on every launch; a hand-made tree fills it in itself.
#
#   delivery = "local" -- on this machine, under a per-GPU lock
#   delivery = "ssh"   -- on one ssh host: the tree is copied to [exec] workdir and
#                         gpu_entry runs there (the host needs the same toolchain)

[job]
timeout = 600                   # seconds one gpu_entry task may take

[repo]
delivery = "local"
branch = "TODO"                 # the operator's working branch
entry_script = "gpu_entry.sh"

[exec]
gpu = "0"                       # CUDA device index
# host = "my-gpu-box"           # ssh delivery: an ssh alias that logs in without a prompt
# workdir = "/tmp/forgekernel"  # ssh delivery: an absolute directory on the host
# env_file = "/opt/env.sh"      # optional: sourced before every job on the host

[env]
PYTHONUNBUFFERED = "1"
