# <op> — timed-window content contract (what each side's stopwatch covers)
#
# The two windows of `eval/timing.py` answer "how to time" (with or without the host tax); this file
# answers "what work is inside the window". The reference's timed call and the student's timed call
# are two different functions, and every place where their boundaries disagree is a fixed tax that
# one side gets for free and the other side pays inside its window — no kernel quality removes it,
# and the ratio does not show it. Both directions count:
#   * the reference gets it for free (favours the reference): a backward operator's reference is
#     called through its own autograd Function and consumes intermediates the forward saved
#     (cumsum, in-chunk solve, LSE…), while the student rebuilds them from the raw inputs inside
#     its window;
#   * the student gets it for free (favours the student): the student's signature directly takes a
#     derived quantity the reference computes inside its window, or produces one output fewer than
#     the reference must produce; reductions/copies the reference does along the way inside its
#     window are in this direction too;
#   * libraries with caches: on the reference's second call its weight/workspace caches are warm.
#
# Rules (machine-checked by `loop start`; undeclared or inconsistent → refuses to start, exit 13;
# `forge <op> window` checks it ahead of time):
#   1. All four lists must be filled: [reference].inputs/outputs = every tensor the reference's timed
#      call consumes/produces (with the reference API's own names); [student].inputs/outputs = the
#      frozen signature of the student's timed call.
#   2. Every item that appears on only one side needs one [[asymmetry]], using one of four keys
#      according to which list it appears in:
#        ref_input      reference consumes, student does not → student rebuilds it in its window   → student pays
#        student_input  student consumes, reference does not → reference computes it in its window → reference pays
#        ref_output     reference produces, student does not → reference produces it in its window → reference pays
#        student_output student produces, reference does not → student produces it in its window   → student pays
#      class is one of three:
#        symmetrize —— only for derived inputs both sides receive (written into both sides' inputs);
#                      neither side pays;
#        price      —— the paying side does this work inside its window; once that side's regex is
#                      set (student_kernel_regex when the student pays, ref_kernel_regex when the
#                      reference pays), the finish step subtracts its share from that side's
#                      per-kernel NCU table and reports a "tax-credited ratio" (the raw ratio
#                      stays the judge);
#        accept     —— the paying side does it and this run knowingly bears it; recorded, not priced.
#      derived_from names the other side's raw input: a raw input named there needs no separate
#      declaration (e.g. the reference consumes g_cumsum and the student consumes g: one
#      ref_input="g_cumsum" derived_from="g" explains both sides).
#   3. The standard form for a backward operator: the window times only the bwd body; one prep step
#      outside the window may produce the saved tensors (training-step semantics, symmetric with the
#      reference's autograd path) — write these tensors into both sides' inputs with
#      class=symmetrize. The prep step is the only place where work can legitimately leave the
#      stopwatch, so it is machine-checked:
#        * every symmetrize item must give shape (the shape the student's timed call receives) and
#          dtype; missing either refuses to start;
#        * prep is written by the **operator-tree author** in eval/bench.py in torch as a module-level
#          def (not a lambda, and it must not reference any name imported from the kernel — the
#          student owns only the timed call, never the step outside the window); the bench runs it
#          outside the window with measure_windows(fn, prep=<that def>) from eval/timing.py and puts
#          the returned "prep" block verbatim into the eval JSON's performance; eval/ncu_run.py must
#          import the same def from bench and call it before torch.cuda.profiler.start() (prep
#          launches in the NCU table dilute the pricing, steal the dominant kernel and pollute the
#          wgmma census). `loop start` checks these three statically and refuses to start if any
#          fails;
#        * every round the driver matches the tensors prep actually produced against the
#          declaration: an extra or missing output, a shape/dtype mismatch, or a timed call that
#          rewrites a prep tensor (the same memory is passed to every timed call, so caching state
#          in it = later calls just copy; timing.py keeps a snapshot to reconcile and reports
#          mutated) = that round fails correctness and is REVERTed; a bench that does not report
#          the prep block at all = a structural defect, and the run stops with prep_unreported; the
#          same mismatch repeated verbatim two rounds in a row = a prep_contract stop.
#          prep's own cost is banked and rendered to the teacher (not counted in the ratio).
#      produced_by names who computed it on the reference side (forward / cache…); on the student
#      side it always comes from prep.
#      produced_by = "cache" (a library's warm cache) is not a tensor and gets no prep check.
#   4. Pricing assumes that side's NCU table covers only the timed call (the tree's ncu_run.py wraps
#      the kernel call in profiler start/stop, so neither prep nor setup launches enter the table);
#      the driver reconciles the table's per-call total against the window reading and, when they
#      differ by more than ±20%, marks pricing unavailable instead of reporting a diluted share.
#
# This file is read only locally (driver / teacher / student) and does not enter GPU jobs
# (.gitattributes export-ignore).
# Below is a placeholder: empty lists = not declared. Fill it in before starting a run.

schema_version = 1

[reference]
window  = ""          # one sentence: what the reference's timed call is (e.g. "bwd body, called through the autograd path")
inputs  = []          # e.g. ["q", "k", "v", "g_cumsum", "A", "beta", "do"]
outputs = []          # e.g. ["dq", "dk", "dv", "dbeta", "dg"]

[student]
window  = ""          # e.g. "bwd call starting from the raw inputs"
inputs  = []          # e.g. ["q", "k", "v", "g", "beta", "do"]
outputs = []          # e.g. ["dq", "dk", "dv", "dg", "dbeta"]

# One entry for every item that appears on only one side:
# [[asymmetry]]
# ref_input = "A"                    # or student_input / ref_output / student_output, exactly one of the four
# class = "price"                    # symmetrize | price | accept
# produced_by = "forward"            # forward | prep | cache | other: who computed it outside the window
# derived_from = "k, beta"           # the other side's raw inputs (those named need no separate declaration)
# student_kernel_regex = "prep_a"    # price, student pays: the launches in the student tree that do only this work (NCU kernel-name regex; may be added later)
# # ref_kernel_regex = "cumsum"      # price, reference pays: the launches inside the reference window that do only this work
# note = "per-chunk triangular solve"
#
# The symmetrized form (A also goes into [student].inputs; the bench's prep step computes it outside the window):
# [[asymmetry]]
# ref_input = "A"
# class = "symmetrize"
# produced_by = "forward"            # reference side: saved by the public forward; student side: produced by the bench prep step
# derived_from = "k, beta"
# shape = [8192, 32, 64]             # the shape the student's timed call receives; the driver checks it every round
# dtype = "bf16"                     # bf16 | fp16 | fp32 | fp64 | e4m3 | e5m2 | i32 | i64 | u8 | bool
# note = "per-chunk triangular solve"
